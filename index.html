<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 알림장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
<style>
  :root{
    --paper:#FAFAF7;
    --surface:#FFFFFF;
    --surface-2:#F2F2EE;
    --ink:#171C2B;
    --ink-2:#454B60;
    --muted:#767B8D;
    --rule:#E3E3DE;
    --rule-2:#EFEFEA;
    --mark:#FFE86B;
    --mark-soft:rgba(255,232,107,.55);
    --t-perf:#D9552B;
    --t-exam:#C43350;
    --t-task:#3766CE;
    --t-prep:#17886B;
    --t-etc:#7351BE;
    --ok:#17886B;
    --shadow:0 1px 2px rgba(23,28,43,.05), 0 8px 24px -12px rgba(23,28,43,.18);
    --sans:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    --serif:"Hahmlet", "IBM Plex Sans KR", serif;
    --pen:"Nanum Pen Script", "IBM Plex Sans KR", cursive;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12141B; --surface:#1A1D26; --surface-2:#232732;
      --ink:#E9EAEF; --ink-2:#B4B8C6; --muted:#868B9C;
      --rule:#2B2F3B; --rule-2:#232732; --mark-soft:rgba(255,232,107,.22);
      --t-perf:#FF8B5E; --t-exam:#FF6D87; --t-task:#7FA5F5; --t-prep:#4FC7A3; --t-etc:#B295F0;
      --ok:#4FC7A3;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12141B; --surface:#1A1D26; --surface-2:#232732;
    --ink:#E9EAEF; --ink-2:#B4B8C6; --muted:#868B9C;
    --rule:#2B2F3B; --rule-2:#232732; --mark-soft:rgba(255,232,107,.22);
    --t-perf:#FF8B5E; --t-exam:#FF6D87; --t-task:#7FA5F5; --t-prep:#4FC7A3; --t-etc:#B295F0;
    --ok:#4FC7A3;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  button{font-family:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--t-task); outline-offset:2px; border-radius:4px}

  .app{
    max-width:460px; margin:0 auto; min-height:100vh; background:var(--paper);
    position:relative; padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  @media (min-width:900px){
    body{background:var(--surface-2)}
    .app{box-shadow:0 0 0 1px var(--rule), 0 24px 60px -30px rgba(23,28,43,.4)}
  }

  header.top{
    position:sticky; top:0; z-index:20; background:var(--paper);
    padding:16px 20px 11px; border-bottom:1px solid var(--rule);
  }
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .eyebrow{font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:600}
  h1{font-family:var(--serif); font-weight:600; font-size:23px; line-height:1.15; margin:2px 0 0; letter-spacing:-.01em}
  .role{
    display:flex; align-items:center; gap:5px; border:1px solid var(--rule); background:var(--surface);
    border-radius:999px; padding:5px 11px; font-size:11.5px; font-weight:600; color:var(--muted);
    cursor:pointer; white-space:nowrap;
  }
  .role i{width:6px; height:6px; border-radius:50%; background:var(--muted); display:block}
  .role.on{color:var(--ink); border-color:var(--ink)}
  .role.on i{background:var(--ok)}

  main{padding:0 20px}
  section{padding:20px 0 4px}
  section + section{border-top:1px solid var(--rule-2)}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:11px}
  h2{font-family:var(--serif); font-size:16px; font-weight:600; margin:0; letter-spacing:-.01em}
  .sec-note{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .link-btn{
    border:0; background:transparent; padding:0; font-size:12px; font-weight:600;
    color:var(--t-task); cursor:pointer;
  }

  /* 오늘 헤드 */
  .hero{display:flex; align-items:center; gap:15px; padding:18px 0 2px}
  .hero-date{font-family:var(--serif); font-size:48px; line-height:.9; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .hero-meta{display:flex; flex-direction:column; gap:3px; padding-top:4px}
  .hero-dow{font-size:15px; font-weight:600}
  .hero-sub{font-size:12.5px; color:var(--muted)}
  .hero-mark{background:linear-gradient(transparent 58%, var(--mark-soft) 58%); padding:0 2px; font-weight:600; color:var(--ink)}

  /* 전달사항 */
  .notices{display:flex; flex-direction:column; gap:9px}
  .notice{
    background:var(--surface); border:1px solid var(--rule); border-radius:11px;
    padding:12px 13px; display:flex; flex-direction:column; gap:5px; position:relative;
  }
  .notice.pin{border-top:3px solid var(--mark)}
  .notice-head{display:flex; align-items:baseline; gap:8px}
  .notice-title{font-size:14.5px; font-weight:600; line-height:1.35; flex:1; word-break:break-word}
  .notice-date{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .notice-body{font-size:13.5px; color:var(--ink-2); line-height:1.6; white-space:pre-wrap; word-break:break-word}
  .pin-flag{font-size:10.5px; font-weight:700; color:var(--ink); background:var(--mark-soft); border-radius:5px; padding:1px 6px}
  .notice-tools{display:flex; gap:8px; margin-top:2px}
  .notice-tools button{
    border:0; background:transparent; padding:0; font-size:12px; font-weight:600;
    color:var(--muted); cursor:pointer;
  }
  .notice-tools button.del{color:var(--t-exam)}

  /* 교시 */
  .periods{display:flex; flex-direction:column}
  .prow{
    display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:11px;
    padding:8px 0; border-bottom:1px solid var(--rule-2);
  }
  .prow:last-child{border-bottom:0}
  .prow.brk .psub{color:var(--muted); font-weight:400}
  .prow.now{background:linear-gradient(90deg, var(--mark-soft), transparent 78%); margin:0 -8px; padding:8px; border-radius:7px; border-bottom-color:transparent}
  .pnum{font-family:var(--serif); font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:center}
  .prow.now .pnum{color:var(--ink); font-weight:600}
  .psub{font-size:14.5px; font-weight:500}
  .psub.empty{color:var(--muted); font-weight:400}
  .ptime{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}

  /* 일정 */
  .events{display:flex; flex-direction:column; gap:8px}
  .ev{
    display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--tc);
    border-radius:10px; padding:11px 12px;
  }
  .ev.tap{cursor:pointer}
  .ev-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .ev-title{font-size:14.5px; font-weight:600; line-height:1.35; word-break:break-word}
  .ev-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:11.5px; color:var(--muted)}
  .tag{font-size:11px; font-weight:600; color:var(--tc)}
  .ev-memo{font-size:12px; color:var(--ink-2); line-height:1.45; white-space:pre-wrap}
  .ev-dday{flex:0 0 auto; font-family:var(--serif); font-size:13px; font-weight:600; color:var(--tc); font-variant-numeric:tabular-nums; padding-top:1px}
  .ev-dday.past{color:var(--muted)}

  .dday-rail{display:flex; gap:10px; overflow-x:auto; padding:2px 20px 12px; margin:0 -20px; scrollbar-width:none}
  .dday-rail::-webkit-scrollbar{display:none}
  .dday{
    flex:0 0 auto; width:132px; background:var(--surface); border:1px solid var(--rule);
    border-top:3px solid var(--tc); border-radius:12px; padding:10px 13px 12px; text-align:left;
    display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow);
  }
  .dday .n{font-family:var(--serif); font-size:21px; font-weight:600; color:var(--tc); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .dday .t{font-size:13px; font-weight:600; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .dday .s{font-size:11px; color:var(--muted)}

  /* 세그먼트 / 칩 */
  .seg{display:flex; gap:4px; background:var(--surface-2); border-radius:10px; padding:3px; margin-bottom:16px}
  .seg button{
    flex:1; border:0; background:transparent; border-radius:8px; padding:7px 0;
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
  .chips{display:flex; gap:7px; overflow-x:auto; padding:0 20px 4px; margin:0 -20px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; border:1px solid var(--rule); background:var(--surface); border-radius:999px;
    padding:6px 13px; font-size:12.5px; font-weight:500; cursor:pointer; color:var(--ink-2);
  }
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .chip.t[aria-pressed="true"]{background:var(--tc); border-color:var(--tc); color:#fff}

  /* 캘린더 */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .cal-title{font-family:var(--serif); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums}
  .cal-nav{display:flex; gap:6px}
  .cal-nav button{width:32px; height:32px; border-radius:9px; border:1px solid var(--rule); background:var(--surface); cursor:pointer; font-size:14px; line-height:1}
  .dow-row, .cal-grid{display:grid; grid-template-columns:repeat(7,1fr)}
  .dow-row{margin-bottom:4px}
  .dow-row span{text-align:center; font-size:11px; font-weight:600; color:var(--muted); padding:4px 0}
  .dow-row span.sun{color:var(--t-exam)}
  .cal-grid{gap:2px}
  .day{aspect-ratio:1/1.05; border:0; background:transparent; cursor:pointer; padding:4px 0 0; display:flex; flex-direction:column; align-items:center; gap:4px; border-radius:9px; font-variant-numeric:tabular-nums}
  .day .n{font-size:13px; font-weight:500; color:var(--ink-2); width:22px; height:22px; display:grid; place-items:center}
  .day.sun .n{color:var(--t-exam)}
  .day.out{visibility:hidden}
  .day.today .n{background:var(--ink); color:var(--paper); border-radius:50%; font-weight:600}
  .day[aria-selected="true"]{background:var(--surface-2); box-shadow:inset 0 0 0 1.5px var(--ink)}
  .dots{display:flex; gap:2.5px; height:5px}
  .dots i{width:5px; height:5px; border-radius:50%; background:var(--dc); display:block}
  .day-panel{margin-top:14px; padding-top:14px; border-top:1px solid var(--rule-2)}
  .day-panel-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
  .day-panel-head h3{font-family:var(--serif); font-size:16px; font-weight:600; margin:0}
  .day-panel-head span{font-size:12px; color:var(--muted)}

  /* 시간표 */
  .tt-wrap{overflow-x:auto; margin:0 -20px; padding:0 20px}
  .tt{width:100%; min-width:296px; border-collapse:separate; border-spacing:3px}
  .tt th{font-size:11.5px; font-weight:600; color:var(--muted); padding:2px 0 5px}
  .tt th:first-child{width:24px}
  .tt td.pn{font-family:var(--serif); font-size:12px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
  .cell-td{position:relative; padding:0}
  .cell{
    background:var(--surface); border:1px solid var(--rule); border-radius:8px; height:44px; width:100%;
    padding:2px 3px; font-size:12.5px; font-weight:500; display:grid; place-items:center; text-align:center;
    line-height:1.2; word-break:keep-all; color:var(--ink);
  }
  .cell.edit{cursor:pointer}
  .cell.blank{color:var(--muted); background:var(--surface-2); border-style:dashed; font-weight:400}
  .cell.today-col{box-shadow:inset 0 0 0 2px var(--mark)}
  .cell-input{position:absolute; inset:0; width:100%; height:100%; border-radius:8px; border:1.5px solid var(--ink); background:var(--surface); text-align:center; font-family:inherit; font-size:12.5px; font-weight:500; color:var(--ink); padding:2px}
  .hint{font-size:12px; color:var(--muted); margin:12px 0 0; line-height:1.55}

  /* 면담 */
  .date-rail{display:flex; gap:7px; overflow-x:auto; padding:0 20px 14px; margin:0 -20px; scrollbar-width:none}
  .date-rail::-webkit-scrollbar{display:none}
  .dchip{
    flex:0 0 auto; width:52px; border:1px solid var(--rule); background:var(--surface); border-radius:12px;
    padding:8px 0 9px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .dchip .d{font-size:10.5px; color:var(--muted); font-weight:600}
  .dchip .n{font-family:var(--serif); font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
  .dchip .m{width:5px; height:5px; border-radius:50%; background:var(--t-perf); margin-top:1px}
  .dchip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
  .dchip[aria-pressed="true"] .d{color:var(--paper); opacity:.75}

  .slots{display:flex; flex-direction:column; gap:9px}
  .slot{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:13px 14px;
    display:flex; align-items:center; gap:12px;
  }
  .slot.taken{background:var(--surface-2)}
  .slot-when{flex:1; min-width:0}
  .slot-name{font-size:14.5px; font-weight:600}
  .slot-time{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:1px}
  .slot-detail{font-size:12.5px; color:var(--ink-2); margin-top:5px; line-height:1.5; white-space:pre-wrap}
  .pill{
    font-size:11.5px; font-weight:700; border-radius:999px; padding:5px 11px; white-space:nowrap;
    border:1px solid var(--rule); color:var(--muted); background:var(--paper);
  }
  .pill.free{color:var(--ok); border-color:var(--ok)}
  .pill.mine{color:var(--t-task); border-color:var(--t-task)}
  .slot-btn{
    border:1px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:10px;
    padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .slot-btn.ghost{background:transparent; color:var(--t-exam); border-color:var(--rule)}

  /* 공통 */
  .empty{text-align:center; padding:22px 16px; color:var(--muted); font-size:13px}
  .empty .pen{font-family:var(--pen); font-size:22px; color:var(--ink-2); display:block; margin-bottom:1px}
  .demo-note{
    display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--ink-2);
    background:var(--mark-soft); border-radius:9px; padding:9px 11px; margin-bottom:12px; line-height:1.5;
  }
  .demo-note b{font-weight:700; color:var(--ink); white-space:nowrap}

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30; max-width:460px; margin:0 auto;
    background:var(--paper); border-top:1px solid var(--rule);
    display:grid; grid-template-columns:repeat(5,1fr); padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{border:0; background:transparent; padding:9px 0 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:500; color:var(--muted)}
  .tab .ic{position:relative; display:grid; place-items:center}
  .tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--ink); font-weight:600}
  .badge{position:absolute; top:-3px; left:12px; background:var(--t-exam); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:99px; display:grid; place-items:center; padding:0 4px; line-height:1}

  .fab{
    position:fixed; z-index:31; right:calc(50% - 230px + 18px); bottom:calc(84px + env(safe-area-inset-bottom));
    height:48px; padding:0 18px; border-radius:16px; border:0; cursor:pointer;
    background:var(--ink); color:var(--paper); font-size:14px; font-weight:600;
    box-shadow:0 6px 20px -6px rgba(23,28,43,.5); display:flex; align-items:center; gap:6px;
  }
  @media (max-width:498px){ .fab{right:18px} }

  .scrim{position:fixed; inset:0; z-index:40; background:rgba(12,14,20,.42); opacity:0; pointer-events:none; transition:opacity .18s ease}
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; z-index:41; left:0; right:0; bottom:0; max-width:460px; margin:0 auto;
    background:var(--paper); border-radius:20px 20px 0 0; border-top:1px solid var(--rule);
    padding:8px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(102%); transition:transform .24s cubic-bezier(.32,.72,0,1);
    max-height:90vh; overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){ .sheet, .scrim{transition:none} }
  .grabber{width:36px; height:4px; border-radius:99px; background:var(--rule); margin:0 auto 14px}
  .sheet h2{margin-bottom:6px; font-size:17px}
  .sheet .lead{font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.5}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:5px}
  .field input, .field textarea{
    width:100%; border:1px solid var(--rule); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:10px 12px; font-family:inherit; font-size:16px;
  }
  .field textarea{resize:vertical; min-height:56px; line-height:1.5; font-size:15px}
  .row2{display:grid; grid-template-columns:1.35fr 1fr; gap:10px}
  .type-picks{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
  .type-pick{border:1px solid var(--rule); background:var(--surface); border-radius:10px; padding:9px 2px; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--muted)}
  .type-pick[aria-pressed="true"]{background:var(--tc); border-color:var(--tc); color:#fff}
  .check-row{display:flex; align-items:center; gap:9px; margin-bottom:12px; cursor:pointer; font-size:13.5px; font-weight:500}
  .check-row input{width:18px; height:18px; accent-color:var(--ink)}
  .sheet-actions{display:flex; gap:9px; margin-top:16px}
  .btn{flex:1; border-radius:12px; padding:13px; font-size:15px; font-weight:600; cursor:pointer; border:1px solid var(--rule); background:var(--surface)}
  .btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .btn.danger{flex:0 0 auto; padding:13px 16px; color:var(--t-exam)}
  .form-err{font-size:12.5px; color:var(--t-exam); margin:8px 0 0; font-weight:500}

  .toast{
    position:fixed; z-index:50; left:50%; bottom:calc(104px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px); background:var(--ink); color:var(--paper); font-size:13px;
    font-weight:500; padding:10px 16px; border-radius:99px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; max-width:88%; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  [hidden]{display:none !important}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div>
        <div class="eyebrow" id="eyebrow">오늘</div>
        <h1 id="page-title">우리 반 알림장</h1>
      </div>
      <button type="button" class="role" id="role-btn"><i></i><span id="role-label">선생님 로그인</span></button>
    </div>
  </header>

  <main>
    <!-- 오늘 -->
    <div id="view-home">
      <div class="hero">
        <div class="hero-date" id="hero-date">8</div>
        <div class="hero-meta">
          <div class="hero-dow" id="hero-dow">화요일</div>
          <div class="hero-sub" id="hero-sub"></div>
        </div>
      </div>
      <div id="home-demo"></div>

      <section>
        <div class="sec-head">
          <h2>전달사항</h2>

  var DAYS = ["mon","tue","wed","thu","fri"];
  var DAY_LABEL = {mon:"월", tue:"화", wed:"수", thu:"목", fri:"금"};
  var DOW_KO = ["일","월","화","수","목","금","토"];

  /* ---------------- 날짜 ---------------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parseISO(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
  function diffDays(a, b){ return Math.round((parseISO(a) - parseISO(b)) / 86400000); }
  function ddayText(n){ return n === 0 ? "D-DAY" : (n > 0 ? "D-" + n : "D+" + (-n)); }
  function mdText(s){ var d = parseISO(s); return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + DOW_KO[d.getDay()] + ")"; }
  function toMin(hm){ var p = hm.split(":"); return (+p[0]) * 60 + (+p[1]); }
  function nowMin(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  var TODAY = iso(today());

  /* ---------------- DOM ---------------- */
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
  var toastTimer;
  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ---------------- 저장소 ---------------- */
  function lsGet(k){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  var CLIENT = lsGet("planner.client");
  if(!CLIENT){ CLIENT = uid(); lsSet("planner.client", CLIENT); }

  var State = {
    cloud:false, teacher:false, user:null,
    notices:[], events:[], bookings:[], details:{}, timetable:{}
  };

  /* --- 데모(로컬) 백엔드 --- */
  var Local = {
    load:function(){
      State.notices = lsGet("planner.notices") || [];
      State.events = lsGet("planner.events") || [];
      State.bookings = lsGet("planner.bookings") || [];
      State.details = lsGet("planner.details") || {};
      State.timetable = lsGet("planner.timetable") || {};
      State.teacher = !!lsGet("planner.teacherMode");
      if(!State.notices.length && !State.events.length) this.seed();
    },
    seed:function(){
      var t = today();
      State.notices = [
        {id:"n1", title:"내일 체육복 등교", body:"3~4교시에 체육 수행평가가 있습니다. 체육복을 입고 등교하세요.", pinned:true, createdAt:Date.now()},
        {id:"n2", title:"학급 문집 원고 마감", body:"이번 주 금요일까지 A4 1장 분량으로 제출해 주세요. 손글씨, 타이핑 모두 괜찮습니다.", pinned:false, createdAt:Date.now() - 86400000}
      ];
      State.events = [
        {id:"e1", type:"task", title:"수학 익힘책 84~91쪽", subject:"수학Ⅰ", date:iso(t), memo:""},
        {id:"e2", type:"prep", title:"실험 보고서 양식 준비", subject:"물리학Ⅰ", date:iso(addDays(t,1)), memo:"2부씩"},
        {id:"e3", type:"perf", title:"문학 서평 발표", subject:"문학", date:iso(addDays(t,3)), memo:"발표 4분 · PPT 6장 이내"},
        {id:"e4", type:"exam", title:"2학기 중간고사 시작", subject:"", date:iso(addDays(t,17)), memo:"국어·수학·영어·한국사"}
      ];
      State.timetable = {
        "mon-1":"국어","mon-2":"수학Ⅰ","mon-3":"영어Ⅰ","mon-4":"한국사","mon-5":"통합사회","mon-6":"체육","mon-7":"창체",
        "tue-1":"수학Ⅰ","tue-2":"문학","tue-3":"물리학Ⅰ","tue-4":"영어Ⅰ","tue-5":"국어","tue-6":"미술",
        "wed-1":"영어Ⅰ","wed-2":"한국사","wed-3":"수학Ⅰ","wed-4":"문학","wed-5":"물리학Ⅰ","wed-6":"동아리",
        "thu-1":"통합사회","thu-2":"국어","thu-3":"체육","thu-4":"수학Ⅰ","thu-5":"영어Ⅰ","thu-6":"물리학Ⅰ","thu-7":"진로",
        "fri-1":"문학","fri-2":"영어Ⅰ","fri-3":"통합사회","fri-4":"수학Ⅰ","fri-5":"한국사"
      };
      this.save();
    },
    save:function(){
      lsSet("planner.notices", State.notices);
      lsSet("planner.events", State.events);
      lsSet("planner.bookings", State.bookings);
      lsSet("planner.details", State.details);
      lsSet("planner.timetable", State.timetable);
    }
  };

  /* --- Firebase 백엔드 --- */
  var FB = {db:null, auth:null};

  function loadScript(src){
    return new Promise(function(res, rej){
      var s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = function(){ rej(new Error(src)); };
      document.head.appendChild(s);
    });
  }

  function initCloud(){
    var base = "https://www.gstatic.com/firebasejs/10.12.2/";
    return loadScript(base + "firebase-app-compat.js")
      .then(function(){ return loadScript(base + "firebase-auth-compat.js"); })
      .then(function(){ return loadScript(base + "firebase-firestore-compat.js"); })
      .then(function(){
        // 비어 있는 항목은 빼고 넘깁니다. appId 처럼 없어도 되는 값 때문에
        // 초기화가 막히지 않도록 하기 위해서입니다.
        var cfg = {};
        Object.keys(FIREBASE_CONFIG).forEach(function(k){
          if(FIREBASE_CONFIG[k]) cfg[k] = FIREBASE_CONFIG[k];
        });
        // authDomain 을 안 적었으면 프로젝트 ID 로 만들어 씁니다.
        if(!cfg.authDomain && cfg.projectId) cfg.authDomain = cfg.projectId + ".firebaseapp.com";

        firebase.initializeApp(cfg);
        FB.db = firebase.firestore();
        FB.auth = firebase.auth();
        State.cloud = true;

        FB.auth.onAuthStateChanged(function(u){
          State.user = u;
          State.teacher = !!u;
          if(u) subscribeDetails(); else { State.details = {}; }
          render();
        });

        FB.db.collection("notices").onSnapshot(function(snap){
          State.notices = snap.docs.map(function(d){
            var v = d.data() || {};
            return {id:d.id, title:v.title || "", body:v.body || "", pinned:!!v.pinned, createdAt:v.createdAt || 0};
          });
          render();
        }, cloudErr);

        FB.db.collection("events").onSnapshot(function(snap){
          State.events = snap.docs.map(function(d){
            var v = d.data() || {};
            return {id:d.id, type:v.type || "etc", title:v.title || "", subject:v.subject || "", date:v.date || TODAY, memo:v.memo || ""};
          });
          render();
        }, cloudErr);

        FB.db.collection("bookings").onSnapshot(function(snap){
          State.bookings = snap.docs.map(function(d){
            var v = d.data() || {};
            return {id:d.id, date:v.date || "", slot:v.slot || "", client:v.client || ""};
          });
          render();
        }, cloudErr);

        FB.db.doc("timetable/grid").onSnapshot(function(snap){
          State.timetable = (snap.exists && (snap.data() || {}).cells) || {};
          render();
        }, cloudErr);
      });
  }

  function subscribeDetails(){
    if(!FB.db) return;
    FB.db.collection("bookingDetails").onSnapshot(function(snap){
      var m = {};
      snap.docs.forEach(function(d){ m[d.id] = d.data() || {}; });
      State.details = m;
      render();
    }, function(){});
  }

  function cloudErr(e){
    console.warn("firestore", e);
    toast("서버에서 자료를 불러오지 못했습니다");
  }

  /* ---------------- 쓰기 동작 ---------------- */
  function saveNotice(n){
    if(State.cloud){
      return FB.db.collection("notices").doc(n.id).set({
        title:n.title, body:n.body, pinned:!!n.pinned, createdAt:n.createdAt
      });
    }
    var i = State.notices.map(function(x){ return x.id; }).indexOf(n.id);
    if(i >= 0) State.notices[i] = n; else State.notices.push(n);
    Local.save(); render();
    return Promise.resolve();
  }
  function removeNotice(id){
    if(State.cloud) return FB.db.collection("notices").doc(id)["delete"]();
    State.notices = State.notices.filter(function(x){ return x.id !== id; });
    Local.save(); render();
    return Promise.resolve();
  }
  function saveEvent(ev){
    if(State.cloud){
      return FB.db.collection("events").doc(ev.id).set({
        type:ev.type, title:ev.title, subject:ev.subject, date:ev.date, memo:ev.memo
      });
    }
    var i = State.events.map(function(x){ return x.id; }).indexOf(ev.id);
    if(i >= 0) State.events[i] = ev; else State.events.push(ev);
    Local.save(); render();
    return Promise.resolve();
  }
  function removeEvent(id){
    if(State.cloud) return FB.db.collection("events").doc(id)["delete"]();
    State.events = State.events.filter(function(x){ return x.id !== id; });
    Local.save(); render();
    return Promise.resolve();
  }
  function setCell(key, value){
    var next = {};
    Object.keys(State.timetable).forEach(function(k){ next[k] = State.timetable[k]; });
    if(value) next[key] = value; else delete next[key];
    State.timetable = next;
    if(State.cloud) return FB.db.doc("timetable/grid").set({cells:next});
    Local.save(); render();
    return Promise.resolve();
  }

  function bookingId(date, slot){ return date + "_" + slot; }

  function createBooking(date, slot, name, klass, reason){
    var id = bookingId(date, slot);
    if(State.cloud){
      // create 는 문서가 없을 때만 성공하므로 중복 예약이 막힙니다.
      return FB.db.collection("bookings").doc(id).set({
        date:date, slot:slot, client:CLIENT, createdAt:Date.now()
      }, {merge:false}).then(function(){
        return FB.db.collection("bookingDetails").doc(id).set({
          name:name, klass:klass, reason:reason, client:CLIENT, createdAt:Date.now()
        });
      });
    }
    if(State.bookings.some(function(b){ return b.id === id; })) return Promise.reject(new Error("taken"));
    State.bookings.push({id:id, date:date, slot:slot, client:CLIENT});
    State.details[id] = {name:name, klass:klass, reason:reason, client:CLIENT};
    Local.save(); render();
    return Promise.resolve();
  }

  function cancelBooking(id){
    if(State.cloud){
      return FB.db.collection("bookings").doc(id)["delete"]().then(function(){
        return FB.db.collection("bookingDetails").doc(id)["delete"]()["catch"](function(){});
      });
    }
    State.bookings = State.bookings.filter(function(b){ return b.id !== id; });
    delete State.details[id];
    Local.save(); render();
    return Promise.resolve();
  }

  function periodRows(dayKey, highlightNow){
    var wrap = el("div", "periods");

  function sortedNotices(){
    return State.notices.slice().sort(function(a, b){
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }
  function upcomingEvents(){
    return State.events.filter(function(e){ return diffDays(e.date, TODAY) >= 0; })
                       .sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  }
  function subjects(){
    var seen = {}, out = [];
    Object.keys(State.timetable).forEach(function(k){
      var v = State.timetable[k];
      if(v && !seen[v]){ seen[v] = 1; out.push(v); }
    });
    State.events.forEach(function(e){ if(e.subject && !seen[e.subject]){ seen[e.subject] = 1; out.push(e.subject); } });
    return out.sort();
  }
  function bookingAt(date, slot){
    var id = bookingId(date, slot);
    for(var i = 0; i < State.bookings.length; i++) if(State.bookings[i].id === id) return State.bookings[i];
    return null;
  }
  function weekdaysAhead(n){
    var out = [], d = today(), guard = 0;
    while(out.length < n && guard < 60){
      var dw = d.getDay();
      if(dw >= 1 && dw <= 5) out.push(iso(d));
      d = addDays(d, 1);
      guard++;
    }
    return out;
  }

  function slotCard(date, c, booking, compact){
    var mine = booking && booking.client === CLIENT;

    when.appendChild(el("div", "slot-name", c.label + " 면담"));

      card.appendChild(el("span", "pill" + (mine ? " mine" : ""), mine ? "내 예약" : "예약됨"));

  function renderPlan(){
    $("plan-cal").hidden = planMode !== "cal";

    Array.prototype.forEach.call($("plan-seg").children, function(b){

  function renderCal(){
    $("cal-title").textContent = calCursor.getFullYear() + "년 " + (calCursor.getMonth()+1) + "월";
    var grid = $("cal-grid");
    clear(grid);

    var byDate = {};
    State.events.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });

    var first = new Date(calCursor.getFullYear(), calCursor.getMonth(), 1);
    var start = addDays(first, -first.getDay());
    for(var i = 0; i < 42; i++){
      var d = addDays(start, i);
      var key = iso(d);
      var inMonth = d.getMonth() === calCursor.getMonth();
      if(i >= 35 && !inMonth) break;
      var cell = el("button", "day" + (inMonth ? "" : " out") + (d.getDay() === 0 ? " sun" : "") + (key === TODAY ? " today" : ""));
      cell.type = "button";
      if(!inMonth) cell.tabIndex = -1;
      cell.setAttribute("aria-selected", key === calSelected ? "true" : "false");
      cell.setAttribute("aria-label", (d.getMonth()+1) + "월 " + d.getDate() + "일");
      cell.appendChild(el("div", "n", d.getDate()));
      var dots = el("div", "dots");
      var seen = {}, count = 0;
      (byDate[key] || []).forEach(function(e){
        if(seen[e.type] || count >= 3) return;
        seen[e.type] = 1; count++;
        var dot = el("i");
        dot.style.setProperty("--dc", (TYPE_MAP[e.type] || TYPE_MAP.etc).color);
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
      (function(k){ cell.addEventListener("click", function(){ calSelected = k; renderCal(); }); })(key);
      grid.appendChild(cell);
    }

    var sd = parseISO(calSelected);
    $("day-panel-title").textContent = (sd.getMonth()+1) + "월 " + sd.getDate() + "일 (" + DOW_KO[sd.getDay()] + ")";
    var n = diffDays(calSelected, TODAY);
    $("day-panel-sub").textContent = n === 0 ? "오늘" : ddayText(n);

    var box = $("day-events");
    clear(box);
    var list = byDate[calSelected] || [];
    if(!list.length){
      if(State.teacher){
        var add = el("button", "btn", "이 날에 일정 추가");
        add.type = "button";
        add.style.width = "100%";
        add.addEventListener("click", function(){ openEvent({date:calSelected}); });
        box.appendChild(add);
      } else {
        box.appendChild(emptyBox("이 날은 비어 있어요", ""));
      }
    } else {
      var wrap = el("div", "events");
      list.forEach(function(ev){ wrap.appendChild(eventRow(ev, {hideDate:true, hideDday:true})); });
      box.appendChild(wrap);
    }
  }

    });
  }

  function editCell(td, key, value){
    if(editingCell) return;
    editingCell = key;
    var input = el("input", "cell-input");
    input.type = "text";
    input.value = value;
    input.maxLength = 8;
    input.setAttribute("aria-label", "과목 이름");
    td.appendChild(input);
    input.focus();
    input.select();
    var closed = false;
    function commit(save){
      if(closed) return;
      closed = true;
      editingCell = null;
      var v = input.value.trim();
      if(input.parentNode) input.parentNode.removeChild(input);
      if(save && v !== value) setCell(key, v);
      else renderTT();
    }
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); commit(true); }
      else if(e.key === "Escape"){ e.preventDefault(); commit(false); }
    });
    input.addEventListener("blur", function(){ commit(true); });
  }

  /* ---------------- 탭 ---------------- */
  var TABS = [
    {id:"home", label:"오늘", title:"우리 반 알림장", eyebrow:"오늘", view:"view-home",
     icon:'<path d="M3.6 9.6 11 4l7.4 5.6V17a1.4 1.4 0 0 1-1.4 1.4H5A1.4 1.4 0 0 1 3.6 17z"/><path d="M8.6 18.4v-5.6h4.8v5.6"/>'},
    {id:"notice", label:"전달사항", title:"전달사항", eyebrow:"전달사항", view:"view-notice",
     icon:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h11A1.5 1.5 0 0 1 18 5.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 16.5z"/><path d="M7.5 8.5h7M7.5 12h7M7.5 15h4"/>'},
    {id:"meet", label:"면담", title:"면담 예약", eyebrow:"면담", view:"view-meet",
     icon:'<circle cx="11" cy="8" r="3.2"/><path d="M4.8 18.2c0-3.1 2.8-5.2 6.2-5.2s6.2 2.1 6.2 5.2"/>'},
    {id:"plan", label:"일정", title:"학급 일정", eyebrow:"일정", view:"view-plan",
     icon:'<rect x="3.5" y="5" width="15" height="13.5" rx="2"/><path d="M3.5 9h15M7.5 3.5v3M14.5 3.5v3"/>'},
    {id:"tt", label:"시간표", title:"주간 시간표", eyebrow:"시간표", view:"view-tt",
     icon:'<rect x="3.5" y="4.5" width="15" height="14" rx="2"/><path d="M3.5 9.5h15M8.5 9.5v9M13.5 9.5v9"/>'}
  ];
  var activeTab = "home";

  function renderTabs(){
    var bar = $("tabbar");
    clear(bar);
    var todayMeet = State.bookings.filter(function(b){ return b.date === TODAY; }).length;
    TABS.forEach(function(t){
      var b = el("button", "tab");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", activeTab === t.id ? "true" : "false");
      var ic = el("span", "ic");
      ic.innerHTML = '<svg viewBox="0 0 22 22" aria-hidden="true">' + t.icon + '</svg>';
      if(t.id === "meet" && State.teacher && todayMeet > 0) ic.appendChild(el("span", "badge", String(todayMeet)));
      b.appendChild(ic);
      b.appendChild(el("span", null, t.label));
      b.addEventListener("click", function(){ switchTab(t.id); });
      bar.appendChild(b);
    });
  }

  function switchTab(id){
    activeTab = id;
    var cur = TABS[0];
    TABS.forEach(function(t){
      $(t.view).hidden = (t.id !== id);
      if(t.id === id) cur = t;
    });
    $("page-title").textContent = cur.title;
    $("eyebrow").textContent = cur.eyebrow;
    window.scrollTo(0, 0);
    render();
  }

  function renderFab(){
    var fab = $("fab");
    clear(fab);
    var show = false, label = "", action = null;
    if(State.teacher && (activeTab === "notice" || activeTab === "home")){
      show = true; label = "전달사항 쓰기"; action = function(){ openNotice(null); };
    } else if(State.teacher && activeTab === "plan"){
      show = true; label = "일정 추가"; action = function(){ openEvent({date: planMode === "cal" ? calSelected : TODAY}); };
    }
    fab.hidden = !show;
    fab.onclick = action;
    if(show) fab.appendChild(document.createTextNode("＋ " + label));
  }

  function renderRole(){
    var btn = $("role-btn");
    btn.classList.toggle("on", State.teacher);
    $("role-label").textContent = State.teacher ? "선생님" : "선생님 로그인";
  }

  /* ---------------- 시트 ---------------- */
  function openSheet(id){
    $("scrim").classList.add("open");
    $(id).classList.add("open");
  }
  function closeSheets(){
    $("scrim").classList.remove("open");
    ["sheet-event", "sheet-notice", "sheet-book", "sheet-login"].forEach(function(id){
      $(id).classList.remove("open");
    });
  }
  $("scrim").addEventListener("click", closeSheets);
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"), function(b){
    b.addEventListener("click", closeSheets);
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeSheets();
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function(b){
    b.addEventListener("click", function(){ switchTab(b.getAttribute("data-go")); });
  });

  /* --- 전달사항 시트 --- */
  var editingNotice = null;
  function openNotice(n){
    editingNotice = n;
    $("nt-sheet-title").textContent = n ? "전달사항 수정" : "전달사항 쓰기";
    $("n-title").value = n ? n.title : "";
    $("n-body").value = n ? n.body : "";
    $("n-pin").checked = n ? !!n.pinned : false;
    $("n-delete").hidden = !n;
    openSheet("sheet-notice");
    if(!n) setTimeout(function(){ $("n-title").focus(); }, 280);
  }
  $("nt-form").addEventListener("submit", function(e){
    e.preventDefault();
    var title = $("n-title").value.trim();
    if(!title){ toast("제목을 적어 주세요"); return; }
    saveNotice({
      id: editingNotice ? editingNotice.id : uid(),
      title: title,
      body: $("n-body").value.trim(),
      pinned: $("n-pin").checked,
      createdAt: editingNotice ? (editingNotice.createdAt || Date.now()) : Date.now()
    }).then(function(){
      closeSheets();
      toast(editingNotice ? "고쳤습니다" : "올렸습니다");
    })["catch"](function(){ toast("저장하지 못했습니다"); });
  });
  $("n-delete").addEventListener("click", function(){
    if(!editingNotice || !window.confirm("이 전달사항을 지울까요?")) return;
    removeNotice(editingNotice.id).then(function(){ closeSheets(); toast("지웠습니다"); });
  });

  /* --- 일정 시트 --- */
  var editingEvent = null, sheetType = "perf";
  function renderTypePicks(){
    var box = $("type-picks");
    clear(box);
    TYPES.forEach(function(t){
      var b = el("button", "type-pick", t.label);
      b.type = "button";
      b.style.setProperty("--tc", t.color);
      b.setAttribute("aria-pressed", sheetType === t.id ? "true" : "false");
      b.addEventListener("click", function(){ sheetType = t.id; renderTypePicks(); });
      box.appendChild(b);
    });
  }
  function openEvent(ev){
    ev = ev || {};
    editingEvent = ev.id ? ev : null;
    sheetType = ev.type || "perf";
    $("ev-sheet-title").textContent = editingEvent ? "일정 수정" : "일정 추가";
    $("f-title").value = ev.title || "";
    $("f-date").value = ev.date || TODAY;
    $("f-subject").value = ev.subject || "";
    $("f-memo").value = ev.memo || "";
    $("f-delete").hidden = !editingEvent;
    renderTypePicks();
    var dl = $("subject-list");
    clear(dl);
    subjects().forEach(function(s){
      var o = document.createElement("option");
      o.value = s;
      dl.appendChild(o);
    });
    openSheet("sheet-event");
    if(!editingEvent) setTimeout(function(){ $("f-title").focus(); }, 280);
  }
  $("ev-form").addEventListener("submit", function(e){
    e.preventDefault();
    var title = $("f-title").value.trim();
    if(!title){ toast("제목을 적어 주세요"); return; }
    saveEvent({
      id: editingEvent ? editingEvent.id : uid(),
      type: sheetType,
      title: title,
      date: $("f-date").value || TODAY,
      subject: $("f-subject").value.trim(),
      memo: $("f-memo").value.trim()
    }).then(function(){
      closeSheets();
      toast(editingEvent ? "고쳤습니다" : "올렸습니다");
    })["catch"](function(){ toast("저장하지 못했습니다"); });
  });
  $("f-delete").addEventListener("click", function(){
    if(!editingEvent || !window.confirm("이 일정을 지울까요?")) return;
    removeEvent(editingEvent.id).then(function(){ closeSheets(); toast("지웠습니다"); });
  });

  /* --- 면담 신청 시트 --- */
  var bookTarget = null;
  function openBooking(date, c){
    bookTarget = {date:date, slot:c.key};
    $("bk-when").textContent = mdText(date) + " · " + c.label + " " + c.s + "–" + c.e;
    var last = lsGet("planner.me") || {};
    $("b-name").value = last.name || "";
    $("b-class").value = last.klass || "";
    $("b-reason").value = "";
    $("bk-err").hidden = true;
    openSheet("sheet-book");
    setTimeout(function(){ ($("b-name").value ? $("b-reason") : $("b-name")).focus(); }, 280);
  }
  $("bk-form").addEventListener("submit", function(e){
    e.preventDefault();
    if(!bookTarget) return;
    var name = $("b-name").value.trim();
    if(!name){ toast("이름을 적어 주세요"); return; }
    var klass = $("b-class").value.trim();
    lsSet("planner.me", {name:name, klass:klass});
    createBooking(bookTarget.date, bookTarget.slot, name, klass, $("b-reason").value.trim())
      .then(function(){ closeSheets(); toast("신청했습니다"); })
      ["catch"](function(){
        var err = $("bk-err");
        err.textContent = "방금 다른 친구가 이 시간을 예약했어요. 다른 시간대를 골라 주세요.";
        err.hidden = false;
        render();
      });
  });

  /* --- 로그인 시트 --- */
  $("role-btn").addEventListener("click", function(){
    if(State.teacher){
      if(!window.confirm("로그아웃할까요?")) return;
      if(State.cloud) FB.auth.signOut();
      else { State.teacher = false; lsSet("planner.teacherMode", false); render(); }
      return;
    }
    $("lg-err").hidden = true;
    $("lg-lead").textContent = State.cloud
      ? "선생님 계정으로 로그인하면 전달사항·일정·시간표를 고칠 수 있습니다."
      : "아직 서버가 연결되지 않았습니다. 데모 모드에서는 로그인 없이 선생님 화면을 둘러볼 수 있어요.";
    $("l-email").parentNode.hidden = !State.cloud;
    $("l-pw").parentNode.hidden = !State.cloud;
    $("lg-form").querySelector(".btn.primary").textContent = State.cloud ? "로그인" : "선생님 화면 켜기";
    openSheet("sheet-login");
  });
  $("lg-form").addEventListener("submit", function(e){
    e.preventDefault();
    if(!State.cloud){
      State.teacher = true;
      lsSet("planner.teacherMode", true);
      closeSheets();
      toast("데모 선생님 화면입니다");
      render();
      return;
    }
    var err = $("lg-err");
    err.hidden = true;
    FB.auth.signInWithEmailAndPassword($("l-email").value.trim(), $("l-pw").value)
      .then(function(){ closeSheets(); toast("로그인했습니다"); })
      ["catch"](function(){
        err.textContent = "이메일 또는 비밀번호가 맞지 않습니다.";
        err.hidden = false;
      });
  });

  /* ---------------- 기타 ---------------- */
  Array.prototype.forEach.call($("plan-seg").children, function(b){
    b.addEventListener("click", function(){ planMode = b.getAttribute("data-mode"); renderPlan(); });
  });
  $("cal-prev").addEventListener("click", function(){ calCursor.setMonth(calCursor.getMonth()-1); renderCal(); });
  $("cal-next").addEventListener("click", function(){ calCursor.setMonth(calCursor.getMonth()+1); renderCal(); });
  $("cal-today").addEventListener("click", function(){
    calCursor = new Date(today().getFullYear(), today().getMonth(), 1);
    calSelected = TODAY;
    renderCal();
  });

  function render(){
    renderRole();
    renderTabs();
    renderFab();
    if(activeTab === "home") renderHome();
    else if(activeTab === "notice") renderNotices();
    else if(activeTab === "meet") renderMeet();
    else if(activeTab === "plan") renderPlan();
    else if(activeTab === "tt") renderTT();
  }

  /* ---------------- 시작 ---------------- */
  Local.load();
  switchTab("home");

  if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId){
    State.notices = []; State.events = []; State.bookings = []; State.timetable = {};
    State.teacher = false;
    render();
    initCloud()["catch"](function(e){
      console.error(e);
      State.cloud = false;
      Local.load();
      toast("서버에 연결하지 못해 데모 모드로 엽니다");
      render();
    });
  }

  setInterval(function(){ if(activeTab === "home" || activeTab === "tt") render(); }, 60000);
})();
</script>
</body>
</html>
